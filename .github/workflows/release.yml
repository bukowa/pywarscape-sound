name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version string (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Standalone Desktop Application
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Verify vgmstream SHA-256 Binary Integrity
        run: uv run pytest tests/test_vgmstream_integrity.py -q

      - name: Run Hermetic Test Suite
        run: uv run pytest tests -m "not assets" -q

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}".StartsWith("v")) {
            $ver = "${{ github.ref_name }}".Substring(1)
          } elseif ("${{ inputs.version }}") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "0.1.0"
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Standalone Distribution Archive
        run: uv run python scripts/build_dist.py --version ${{ steps.get_version.outputs.version }}

      - name: Compute Release Checksums (SHA-256)
        shell: pwsh
        run: |
          Get-FileHash -Path dist/*.zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
